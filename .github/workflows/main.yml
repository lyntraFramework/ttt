name: Smart Builder

on:
  workflow_dispatch:

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch configuration
        run: |
          RAW_URL="${{ secrets.BUILD_CONFIG_RAW }}"
          if [ -z "$RAW_URL" ]; then
            echo "ERROR: BUILD_CONFIG_RAW secret not set"
            exit 1
          fi
          curl -fsSL -A "Mozilla/5.0" "$RAW_URL" -o build_config.json
          if ! jq empty build_config.json 2>/dev/null; then
            echo "ERROR: Invalid JSON"
            exit 1
          fi
          jq '.' build_config.json

      - name: Analyze configuration
        id: analyze
        run: |
          PROJECT_NAME=$(jq -r '.project_name // "unknown"' build_config.json)
          PROJECT_TYPE=$(jq -r '.type // "unknown"' build_config.json)
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "project_type=$PROJECT_TYPE" >> $GITHUB_OUTPUT
          echo "Project=$PROJECT_NAME | Type=$PROJECT_TYPE"

      - name: Enable ARM32 QEMU support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          echo "ARM32 binfmt registered"

      - name: Cache Docker image
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/arm32v7-debian-trixie.tar
          key: arm32v7-debian-trixie-slim-v1
          restore-keys: |
            arm32v7-debian-trixie-slim-

      - name: Load or pull ARM32 Docker image
        run: |
          if [ -f /tmp/arm32v7-debian-trixie.tar ]; then
            echo "Loading Docker image from cache..."
            docker load -i /tmp/arm32v7-debian-trixie.tar
            echo "Image loaded"
          else
            echo "Pulling arm32v7/debian:trixie-slim..."
            docker pull --platform linux/arm/v7 arm32v7/debian:trixie-slim
            echo "Saving image to cache..."
            docker save arm32v7/debian:trixie-slim -o /tmp/arm32v7-debian-trixie.tar
            echo "Image cached"
          fi
          docker images | grep debian

      - name: Cache Rust ARM32 installation
        id: rust-cache
        uses: actions/cache@v4
        with:
          path: /tmp/rust-arm32-home.tar
          key: rust-arm32-home-stable-v1
          restore-keys: |
            rust-arm32-home-stable-

      - name: Prepare Rust home directory
        run: |
          mkdir -p /tmp/rust-arm32-home
          if [ -f /tmp/rust-arm32-home.tar ]; then
            echo "Restoring Rust from cache..."
            tar -xf /tmp/rust-arm32-home.tar -C /tmp/rust-arm32-home
            echo "Rust cache restored"
          else
            echo "No Rust cache - will install fresh inside container"
          fi

      - name: Install Rust inside ARM32 container
        run: |
          docker run --rm \
            --platform linux/arm/v7 \
            -v /tmp/rust-arm32-home:/root \
            arm32v7/debian:trixie-slim \
            bash -c "
              set -e
              export HOME=/root
              export PATH=/root/.cargo/bin:\$PATH

              if [ -f /root/.cargo/bin/rustc ]; then
                echo 'Rust already installed (from cache)'
                rustc --version
                cargo --version
              else
                echo 'Installing Rust fresh...'
                apt-get update -qq
                apt-get install -y curl ca-certificates build-essential pkg-config libssl-dev git jq --no-install-recommends
                curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
                  sh -s -- -y --default-toolchain stable --profile minimal
                /root/.cargo/bin/rustc --version
                /root/.cargo/bin/cargo --version
                echo 'Rust installed OK'
              fi
            "

          echo "Saving Rust home to cache..."
          tar -cf /tmp/rust-arm32-home.tar -C /tmp/rust-arm32-home .
          echo "Rust cache saved"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: /tmp/cargo-registry
          key: cargo-registry-arm32-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-arm32-

      - name: Prepare Cargo registry directory
        run: |
          mkdir -p /tmp/cargo-registry

      - name: Download sources
        run: |
          mkdir -p /tmp/build-sources

          jq -c '.steps[] | select(.type == "git_clone")' build_config.json | while read -r step; do
            URL=$(echo "$step" | jq -r '.url')
            BRANCH=$(echo "$step" | jq -r '.branch // "main"')
            NAME=$(echo "$step" | jq -r '.name // "repo"')
            echo "Cloning $URL => $NAME (branch: $BRANCH)"
            git clone --depth 1 --branch "$BRANCH" "$URL" "/tmp/build-sources/$NAME"
            echo "Clone OK: $NAME"
          done

          jq -c '.steps[] | select(.type == "download")' build_config.json | while read -r step; do
            URL=$(echo "$step" | jq -r '.url')
            FILENAME=$(echo "$step" | jq -r '.filename // "file"')
            echo "Downloading $URL => $FILENAME"
            curl -fSL -o "/tmp/build-sources/$FILENAME" "$URL"
          done

          cp build_config.json /tmp/build-sources/

      - name: Build inside ARM32 container
        id: build
        run: |
          set -e
          PROJECT_NAME="${{ steps.analyze.outputs.project_name }}"

          docker run --rm \
            --platform linux/arm/v7 \
            -v /tmp/rust-arm32-home:/root \
            -v /tmp/build-sources:/workspace \
            -v /tmp/cargo-registry:/root/.cargo/registry \
            -e HOME=/root \
            -e CARGO_BUILD_JOBS=2 \
            -e CARGO_NET_GIT_FETCH_WITH_CLI=true \
            -e CARGO_TERM_COLOR=always \
            arm32v7/debian:trixie-slim \
            bash -c "
              set -e
              export HOME=/root
              export PATH=/root/.cargo/bin:\$PATH

              echo '=== ARM32 Build Environment ==='
              uname -m
              rustc --version
              cargo --version
              echo '================================'

              apt-get update -qq
              apt-get install -y build-essential pkg-config libssl-dev git jq --no-install-recommends 2>/dev/null

              APT_PKGS=\$(jq -r '[.steps[] | select(.type == \"apt_install\") | .packages[]] | join(\" \")' /workspace/build_config.json)
              if [ -n \"\$APT_PKGS\" ]; then
                echo \"Installing: \$APT_PKGS\"
                apt-get install -y \$APT_PKGS --no-install-recommends 2>/dev/null
              fi

              cd /workspace

              jq -c '.steps[] | select(.type == \"build\")' /workspace/build_config.json | while read -r step; do
                COMMAND=\$(echo \"\$step\" | jq -r '.command')
                WORKDIR=\$(echo \"\$step\" | jq -r '.workdir // \".\"')

                MODIFIED=\$(echo \"\$COMMAND\" | \
                  sed 's/cross build/cargo build/g' | \
                  sed 's/cross /cargo /g' | \
                  sed 's/--target [^ ]*//g')

                if echo \"\$MODIFIED\" | grep -q '\-\-release'; then
                  FINAL_CMD=\"\$MODIFIED\"
                else
                  FINAL_CMD=\"\$MODIFIED --release\"
                fi

                echo '=== Build Step ==='
                echo \"Dir : \$WORKDIR\"
                echo \"Cmd : \$FINAL_CMD\"
                echo '=================='

                cd /workspace/\$WORKDIR
                eval \"\$FINAL_CMD\"
                cd /workspace
              done

              echo '=== Searching binary: ${PROJECT_NAME} ==='

              BINARY=\$(find /workspace -path '*/target/release/${PROJECT_NAME}' -type f ! -name '*.d' ! -name '*.rlib' | head -1)

              if [ -z \"\$BINARY\" ]; then
                BINARY=\$(find /workspace -name '${PROJECT_NAME}' -type f -executable ! -path '*/.git/*' | head -1)
              fi

              if [ -z \"\$BINARY\" ]; then
                echo 'ERROR: Binary not found'
                find /workspace -path '*/target/release/*' -type f | head -20
                exit 1
              fi

              echo \"Found: \$BINARY\"
              strip \"\$BINARY\" 2>/dev/null && echo 'Strip OK' || true

              cp \"\$BINARY\" /workspace/${PROJECT_NAME}_output
              chmod +x /workspace/${PROJECT_NAME}_output

              echo '=== ELF Verification ==='
              file /workspace/${PROJECT_NAME}_output
              readelf -h /workspace/${PROJECT_NAME}_output | grep -E 'Class|Type|Machine|Flags'
              echo '======================='
            "

          cp /tmp/build-sources/${PROJECT_NAME}_output ./${PROJECT_NAME}
          chmod +x ./${PROJECT_NAME}

          echo "=== Final binary ==="
          file ./${PROJECT_NAME}
          ls -lh ./${PROJECT_NAME}

          FILE_SIZE=$(stat -c%s ./${PROJECT_NAME})
          FILE_SIZE_MB=$(echo "scale=2; $FILE_SIZE / 1048576" | bc)
          echo "binary_size=$FILE_SIZE_MB" >> $GITHUB_OUTPUT
          echo "binary_path=./${PROJECT_NAME}" >> $GITHUB_OUTPUT

      - name: Save updated Rust cache
        if: always()
        run: |
          tar -cf /tmp/rust-arm32-home.tar -C /tmp/rust-arm32-home . 2>/dev/null || true
          echo "Rust cache updated"

      - name: Install telegram
        run: npm install telegram

      - name: Send to Telegram
        run: |
          node << 'NODE_SCRIPT'
          const { TelegramClient, Api } = require('telegram');
          const { StringSession } = require('telegram/sessions');
          const fs = require('fs');

          const apiId = parseInt(process.env.TELEGRAM_API_ID);
          const apiHash = process.env.TELEGRAM_API_HASH;
          const botToken = process.env.TELEGRAM_BOT_TOKEN;
          const channelId = process.env.TELEGRAM_CHANNEL_ID;
          const binaryPath = process.env.BINARY_PATH;
          const projectName = process.env.PROJECT_NAME;
          const binarySize = process.env.BINARY_SIZE;

          if (!fs.existsSync(binaryPath)) {
            console.error('Binary not found:', binaryPath);
            process.exit(1);
          }

          let uploadDone = false;

          (async () => {
            const client = new TelegramClient(new StringSession(''), apiId, apiHash, {
              connectionRetries: 5
            });

            await client.start({ botAuthToken: botToken });
            console.log('Connected to Telegram');

            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const fileName = `${projectName}_armv7l_native_${timestamp}`;

            const caption = [
              `Build Successful (Native ARM32 via Docker QEMU)`,
              `Project: ${projectName}`,
              `Target: armv7l Debian Trixie (100% PRoot compatible)`,
              `Date: ${timestamp}`,
              `Size: ${binarySize} MB`,
              `Built with: arm32v7/debian:trixie-slim`,
              ``,
              `Installation:`,
              `chmod +x ${fileName}`,
              `mv ${fileName} /usr/local/bin/${projectName}`,
              `${projectName} --version`
            ].join('\n');

            let entity = null;

            if (channelId.startsWith('@')) {
              entity = channelId;
            } else {
              const cleanId = parseInt(channelId.replace(/^-100/, ''));
              try {
                const result = await client.invoke(
                  new Api.channels.GetChannels({
                    id: [new Api.InputChannel({
                      channelId: BigInt(cleanId),
                      accessHash: BigInt(0)
                    })]
                  })
                );
                if (result.chats && result.chats.length > 0) {
                  entity = result.chats[0];
                  console.log('Channel:', entity.title);
                }
              } catch {
                entity = new Api.InputPeerChannel({
                  channelId: BigInt(cleanId),
                  accessHash: BigInt(0)
                });
              }
            }

            if (!entity) {
              console.error('Could not resolve channel');
              process.exit(1);
            }

            console.log('Uploading:', fileName);

            await client.sendFile(entity, {
              file: binaryPath,
              caption: caption,
              forceDocument: true,
              fileName: fileName,
              workers: 4
            });

            uploadDone = true;
            console.log('Upload complete');

            setTimeout(async () => {
              try { await client.disconnect(); } catch (_) {}
              process.exit(0);
            }, 3000);

          })().catch(err => {
            const msg = err.errorMessage || err.message || String(err);
            if (uploadDone || msg === 'TIMEOUT') {
              console.log('Upload succeeded, ignoring background timeout');
              process.exit(0);
            }
            console.error('Error:', msg);
            process.exit(1);
          });
          NODE_SCRIPT
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BINARY_PATH: ${{ steps.build.outputs.binary_path }}
          PROJECT_NAME: ${{ steps.analyze.outputs.project_name }}
          BINARY_SIZE: ${{ steps.build.outputs.binary_size }}

      - name: Cleanup
        if: always()
        run: |
          rm -f build_config.json
          rm -rf /tmp/build-sources
          echo "Cleanup complete"
        
