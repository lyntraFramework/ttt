name: Smart Builder (ARMHF Compatible)

on:
  workflow_dispatch:

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Fetch configuration
        run: |
          RAW_URL="${{ secrets.BUILD_CONFIG_RAW }}"
          if [ -z "$RAW_URL" ]; then
            echo "ERROR: BUILD_CONFIG_RAW secret not set"
            exit 1
          fi
          curl -fsSL -A "Mozilla/5.0" "$RAW_URL" > build_config.json
          jq empty build_config.json || { echo "Invalid JSON"; exit 1; }
          echo "✅ Configuration validated"a
          cat build_config.json

      - name: Analyze configuration
        id: analyze
        run: |
          PROJECT_NAME=$(jq -r '.project_name // "unknown"' build_config.json)
          PROJECT_TYPE=$(jq -r '.type // "unknown"' build_config.json)
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "project_type=$PROJECT_TYPE" >> $GITHUB_OUTPUT

      - name: Setup QEMU and ARM chroot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user-static binfmt-support debootstrap
          sudo docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          echo "✅ QEMU ready"

      - name: Prepare directories
        run: |
          mkdir -p /tmp/cargo-registry
          mkdir -p /tmp/build-sources
          mkdir -p /tmp/output

      - name: Download sources
        run: |
          jq -c '.steps[] | select(.type == "git_clone")' build_config.json | while read -r step; do
            URL=$(echo "$step" | jq -r '.url')
            BRANCH=$(echo "$step" | jq -r '.branch // "main"')
            NAME=$(echo "$step" | jq -r '.name // "repo"')
            echo "Cloning $URL => $NAME (branch: $BRANCH)"
            git clone --depth 1 --branch "$BRANCH" "$URL" "/tmp/build-sources/$NAME"
            echo "Clone OK: $NAME"
          done

          jq -c '.steps[] | select(.type == "download")' build_config.json | while read -r step; do
            URL=$(echo "$step" | jq -r '.url')
            FILENAME=$(echo "$step" | jq -r '.filename // "file"')
            curl -fSL -o "/tmp/build-sources/$FILENAME" "$URL"
          done

          cp build_config.json /tmp/build-sources/

      - name: Build inside ARM32 container
        id: build
        run: |
          set -e
          PROJECT_NAME="${{ steps.analyze.outputs.project_name }}"

          docker run --rm \
            --platform linux/arm/v7 \
            -v /tmp/build-sources:/workspace \
            -v /tmp/cargo-registry:/usr/local/cargo-registry \
            -v /tmp/output:/output \
            -e DEBIAN_FRONTEND=noninteractive \
            -e CARGO_BUILD_JOBS=2 \
            -e CARGO_NET_GIT_FETCH_WITH_CLI=true \
            -e CARGO_TERM_COLOR=always \
            arm32v7/debian:trixie-slim \
            bash -c "
              set -e

              echo '=== Step 1: Install system packages ==='
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                curl ca-certificates \
                build-essential \
                pkg-config \
                libssl-dev \
                git \
                jq \
                libatomic1 \
                file \
                binutils

              echo '=== Step 2: Extract installed packages ==='
              dpkg-query -W -f='\${binary:Package} \${Version}\n' | sort > /tmp/installed_packages.txt
              echo 'First 20 installed packages:'
              head -n 20 /tmp/installed_packages.txt
              cp /tmp/installed_packages.txt /output/installed_packages.txt

              echo '=== Step 3: Install Rust ==='
              export HOME=/root
              export CARGO_HOME=/root/.cargo
              export RUSTUP_HOME=/root/.rustup

              if [ ! -f /root/.cargo/bin/rustc ]; then
                curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
                  sh -s -- -y --default-toolchain stable --profile minimal
              fi

              export PATH=/root/.cargo/bin:\$PATH
              rustc --version
              cargo --version

              echo '=== Step 4: Restore Cargo registry cache ==='
              if [ -d /usr/local/cargo-registry ] && [ \"\$(ls -A /usr/local/cargo-registry 2>/dev/null)\" ]; then
                echo 'Restoring registry cache...'
                mkdir -p /root/.cargo/registry
                cp -r /usr/local/cargo-registry/. /root/.cargo/registry/ 2>/dev/null || true
                echo 'Registry cache restored'
              fi

              echo '=== Step 5: Install extra apt packages ==='
              APT_PKGS=\$(jq -r '[.steps[] | select(.type == \"apt_install\") | .packages[]] | join(\" \")' /workspace/build_config.json)
              if [ -n \"\$APT_PKGS\" ]; then
                echo \"Installing: \$APT_PKGS\"
                apt-get install -y --no-install-recommends \$APT_PKGS 2>/dev/null || true
              fi

              echo '=== Step 6: Build ==='
              cd /workspace

              jq -c '.steps[] | select(.type == \"build\")' /workspace/build_config.json | while read -r step; do
                COMMAND=\$(echo \"\$step\" | jq -r '.command')
                WORKDIR=\$(echo \"\$step\" | jq -r '.workdir // \".\"')

                MODIFIED=\$(echo \"\$COMMAND\" | \
                  sed 's/cross build/cargo build/g' | \
                  sed 's/cross /cargo /g' | \
                  sed 's/--target [^ ]*//g')

                if echo \"\$MODIFIED\" | grep -q '\-\-release'; then
                  FINAL_CMD=\"\$MODIFIED\"
                else
                  FINAL_CMD=\"\$MODIFIED --release\"
                fi

                echo \"Dir: \$WORKDIR\"
                echo \"Cmd: \$FINAL_CMD\"

                cd /workspace/\$WORKDIR
                eval \"\$FINAL_CMD\"
                cd /workspace
              done

              echo '=== Step 7: Find binary ==='
              BINARY=\$(find /workspace -path \"*/target/release/${PROJECT_NAME}\" -type f ! -name '*.d' ! -name '*.rlib' | head -1)

              if [ -z \"\$BINARY\" ]; then
                BINARY=\$(find /workspace -name \"${PROJECT_NAME}\" -type f -executable ! -path '*/.git/*' | head -1)
              fi

              if [ -z \"\$BINARY\" ]; then
                echo 'ERROR: Binary not found'
                find /workspace -path '*/target/release/*' -type f | head -20
                exit 1
              fi

              echo \"Found: \$BINARY\"
              strip \"\$BINARY\" 2>/dev/null && echo 'Strip OK' || true

              cp \"\$BINARY\" /output/${PROJECT_NAME}
              chmod +x /output/${PROJECT_NAME}

              echo '=== Step 8: ELF Verification ==='
              file /output/${PROJECT_NAME}
              readelf -h /output/${PROJECT_NAME} | grep -E 'Class|Type|Machine|Flags' || true

              echo '=== Step 9: Save Cargo registry cache ==='
              if [ -d /root/.cargo/registry ]; then
                cp -r /root/.cargo/registry/. /usr/local/cargo-registry/ 2>/dev/null || true
                echo 'Registry cache saved'
              fi
            "

          cp /tmp/output/${PROJECT_NAME} ./${PROJECT_NAME}
          chmod +x ./${PROJECT_NAME}

          echo "=== Final binary ==="
          file ./${PROJECT_NAME}
          ls -lh ./${PROJECT_NAME}

          FILE_SIZE=$(stat -c%s ./${PROJECT_NAME})
          FILE_SIZE_MB=$(echo "scale=2; $FILE_SIZE / 1048576" | bc)

          echo "BINARY_PATH=./${PROJECT_NAME}" >> $GITHUB_ENV
          echo "BINARY_SIZE=${FILE_SIZE_MB}" >> $GITHUB_ENV
          echo "binary_path=./${PROJECT_NAME}" >> $GITHUB_OUTPUT
          echo "binary_size=${FILE_SIZE_MB}" >> $GITHUB_OUTPUT

      - name: Install telegram
        run: npm install telegram

      - name: Send to Telegram
        run: |
          node << 'NODE_SCRIPT'
          const { TelegramClient, Api } = require('telegram');
          const { StringSession } = require('telegram/sessions');
          const fs = require('fs');

          const apiId = parseInt(process.env.TELEGRAM_API_ID);
          const apiHash = process.env.TELEGRAM_API_HASH;
          const botToken = process.env.TELEGRAM_BOT_TOKEN;
          const channelId = process.env.TELEGRAM_CHANNEL_ID;
          const binaryPath = process.env.BINARY_PATH;
          const projectName = process.env.PROJECT_NAME;
          const binarySize = process.env.BINARY_SIZE;

          if (!fs.existsSync(binaryPath)) {
            console.error('Binary not found:', binaryPath);
            process.exit(1);
          }

          let uploadDone = false;

          (async () => {
            const client = new TelegramClient(new StringSession(''), apiId, apiHash, {
              connectionRetries: 5
            });

            await client.start({ botAuthToken: botToken });
            console.log('Connected to Telegram');

            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const fileName = `${projectName}_armv7l_native_${timestamp}`;

            const caption = [
              `Build Successful (Native ARM32 Docker)`,
              `Project: ${projectName}`,
              `Target: armv7l Debian Trixie (100% PRoot compatible)`,
              `Date: ${timestamp}`,
              `Size: ${binarySize} MB`,
              `Built with: arm32v7/debian:trixie-slim + Rust stable`,
              ``,
              `Installation:`,
              `chmod +x ${fileName}`,
              `mv ${fileName} /usr/local/bin/${projectName}`,
              `${projectName} --version`
            ].join('\n');

            let entity = null;

            if (channelId.startsWith('@')) {
              entity = channelId;
            } else {
              const cleanId = parseInt(channelId.replace(/^-100/, ''));
              try {
                const result = await client.invoke(
                  new Api.channels.GetChannels({
                    id: [new Api.InputChannel({
                      channelId: BigInt(cleanId),
                      accessHash: BigInt(0)
                    })]
                  })
                );
                if (result.chats && result.chats.length > 0) {
                  entity = result.chats[0];
                  console.log('Channel:', entity.title);
                }
              } catch {
                entity = new Api.InputPeerChannel({
                  channelId: BigInt(cleanId),
                  accessHash: BigInt(0)
                });
              }
            }

            if (!entity) {
              console.error('Could not resolve channel');
              process.exit(1);
            }

            console.log('Uploading:', fileName);

            await client.sendFile(entity, {
              file: binaryPath,
              caption: caption,
              forceDocument: true,
              fileName: fileName,
              workers: 4
            });

            uploadDone = true;
            console.log('Upload complete');

            setTimeout(async () => {
              try { await client.disconnect(); } catch (_) {}
              process.exit(0);
            }, 3000);

          })().catch(err => {
            const msg = err.errorMessage || err.message || String(err);
            if (uploadDone || msg === 'TIMEOUT') {
              console.log('Upload succeeded, ignoring background timeout');
              process.exit(0);
            }
            console.error('Error:', msg);
            process.exit(1);
          });
          NODE_SCRIPT
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BINARY_PATH: ${{ env.BINARY_PATH }}
          PROJECT_NAME: ${{ steps.analyze.outputs.project_name }}
          BINARY_SIZE: ${{ env.BINARY_SIZE }}

      - name: Cleanup
        if: always()
        run: |
          rm -f build_config.json
          sudo rm -rf /tmp/build-sources /tmp/output /tmp/cargo-registry
          echo "Cleanup complete"
