name: Smart Builder

on:
  workflow_dispatch:

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch configuration
        run: |
          RAW_URL="${{ secrets.BUILD_CONFIG_RAW }}"
          if [ -z "$RAW_URL" ]; then
            echo "ERROR: BUILD_CONFIG_RAW secret not set"
            exit 1
          fi
          curl -s -A "Mozilla/5.0" "$RAW_URL" > build_config.json
          jq empty build_config.json || { echo "Invalid JSON"; exit 1; }
          echo "✅ Configuration validated"
          cat build_config.json

      - name: Analyze configuration
        id: analyze
        run: |
          PROJECT_NAME=$(jq -r '.project_name // "unknown"' build_config.json)
          PROJECT_TYPE=$(jq -r '.type // "unknown"' build_config.json)
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "project_type=$PROJECT_TYPE" >> $GITHUB_OUTPUT

      - name: Setup QEMU and ARM chroot
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support debootstrap
          sudo docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          echo "✅ QEMU ready"

      - name: Create ARM rootfs and build
        id: build
        run: |
          set -e
          PROJECT_NAME="${{ steps.analyze.outputs.project_name }}"

          mkdir -p arm-root
          cd arm-root

          echo "📥 Downloading Debian armhf (trixie)..."
          sudo debootstrap --arch=armhf --foreign --variant=minbase trixie debian-armhf http://deb.debian.org/debian

          sudo chroot debian-armhf /debootstrap/debootstrap --second-stage

          sudo chroot debian-armhf bash -c "
            apt-get update
            apt-get install -y curl build-essential pkg-config libssl-dev git ca-certificates
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source /root/.cargo/env
            rustc --version
          "

          sudo cp ../build_config.json debian-armhf/root/

          sudo chroot debian-armhf bash -c "
            cd /root
            source /root/.cargo/env

            APT_PKGS=\$(jq -r '[.steps[] | select(.type == \"apt_install\") | .packages[]] | @sh' build_config.json)
            if [ -n \"\$APT_PKGS\" ]; then
              eval apt-get install -y \$APT_PKGS
            fi

            jq -c '.steps[] | select(.type == \"git_clone\")' build_config.json | while read -r step; do
              URL=\$(echo \"\$step\" | jq -r '.url')
              BRANCH=\$(echo \"\$step\" | jq -r '.branch // \"main\"')
              NAME=\$(echo \"\$step\" | jq -r '.name // \"repo\"')
              git clone --depth 1 --branch \"\$BRANCH\" \"\$URL\" \"\$NAME\"
            done

            jq -c '.steps[] | select(.type == \"download\")' build_config.json | while read -r step; do
              URL=\$(echo \"\$step\" | jq -r '.url')
              FILENAME=\$(echo \"\$step\" | jq -r '.filename // \"downloaded_file\"')
              curl -L -o \"\$FILENAME\" \"\$URL\"
            done

            jq -c '.steps[] | select(.type == \"build\")' build_config.json | while read -r step; do
              COMMAND=\$(echo \"\$step\" | jq -r '.command')
              WORKDIR=\$(echo \"\$step\" | jq -r '.workdir // \".\"')

              # 🔥 الإصلاح: استبدال cross بـ cargo، وإزالة أي --target
              MODIFIED_CMD=\$(echo \"\$COMMAND\" | sed 's/cross build/cargo build/g' | sed 's/cross /cargo /g' | sed 's/--target [^ ]*//g')

              echo \"Executing (native ARM build): \$MODIFIED_CMD in \$WORKDIR\"
              cd \"\$WORKDIR\"
              eval \"\$MODIFIED_CMD\"
              cd /root
            done

            BINARY=\$(find . -name \"$PROJECT_NAME\" -type f -executable | head -1)
            if [ -z \"\$BINARY\" ]; then
              BINARY=\$(find . -path '*/target/*/release/$PROJECT_NAME' -type f | head -1)
            fi

            if [ -n \"\$BINARY\" ]; then
              strip \"\$BINARY\" 2>/dev/null || true
              cp \"\$BINARY\" /root/$PROJECT_NAME
              chmod +x /root/$PROJECT_NAME
              echo \"✅ Binary ready: \$(ls -lh /root/$PROJECT_NAME)\"
              file /root/$PROJECT_NAME
              readelf -h /root/$PROJECT_NAME | head -5
            else
              echo \"❌ Binary not found\"
              exit 1
            fi
          "

          cp debian-armhf/root/$PROJECT_NAME ../$PROJECT_NAME
          ls -lh ../$PROJECT_NAME

          FILE_SIZE=\$(stat -c%s ../$PROJECT_NAME)
          FILE_SIZE_MB=\$((FILE_SIZE / 1024 / 1024))
          echo "binary_size=$FILE_SIZE_MB" >> $GITHUB_OUTPUT

      - name: Install telegram
        run: npm install telegram

      - name: Send to Telegram
        run: |
          node << 'NODE_SCRIPT'
          const { TelegramClient, Api } = require('telegram');
          const { StringSession } = require('telegram/sessions');
          const fs = require('fs');

          const apiId = parseInt(process.env.TELEGRAM_API_ID);
          const apiHash = process.env.TELEGRAM_API_HASH;
          const botToken = process.env.TELEGRAM_BOT_TOKEN;
          const channelId = process.env.TELEGRAM_CHANNEL_ID;
          const projectName = process.env.PROJECT_NAME;
          const binarySize = process.env.BINARY_SIZE;

          (async () => {
            const client = new TelegramClient(new StringSession(''), apiId, apiHash, {
              connectionRetries: 5
            });

            await client.start({ botAuthToken: botToken });
            console.log('Connected as bot');

            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const fileName = `${projectName}_armhf_native_${timestamp}`;

            const caption = `✅ Build Successful (Native ARM via QEMU)\n` +
                           `📦 Project: ${projectName}\n` +
                           `🎯 Target: armhf (native, NO cross-compilation)\n` +
                           `📅 Date: ${timestamp}\n` +
                           `💾 Size: ${binarySize} MB\n` +
                           `🔧 Built inside Debian armhf via QEMU\n\n` +
                           `📥 Installation:\n` +
                           `chmod +x ${fileName}\n` +
                           `mv ${fileName} /usr/local/bin/${projectName}\n` +
                           `${projectName} --version\n\n` +
                           `⚠️ Works guaranteed in PRoot!`;

            let entity = null;
            if (channelId.startsWith('@')) {
              entity = channelId;
            } else {
              const cleanId = parseInt(channelId.replace(/^-100/, ''));
              entity = new Api.InputPeerChannel({
                channelId: BigInt(cleanId),
                accessHash: BigInt(0)
              });
            }

            await client.sendFile(entity, {
              file: projectName,
              caption: caption,
              forceDocument: true,
              fileName: fileName,
              workers: 4
            });

            console.log('✅ Sent successfully');
            await client.disconnect();
          })().catch(err => {
            console.error('Error:', err.errorMessage || err.message || err);
            process.exit(1);
          });
          NODE_SCRIPT
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          PROJECT_NAME: ${{ steps.analyze.outputs.project_name }}
          BINARY_SIZE: ${{ steps.build.outputs.binary_size }}

      - name: Cleanup
        if: always()
        run: |
          rm -f build_config.json
          rm -rf arm-root
          rm -f ${{ steps.analyze.outputs.project_name }}
