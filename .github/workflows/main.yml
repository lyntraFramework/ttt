name: Smart Builder (Termux Native)

on:
  workflow_dispatch:

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch configuration
        run: |
          RAW_URL="${{ secrets.BUILD_CONFIG_RAW }}"
          if [ -z "$RAW_URL" ]; then
            echo "ERROR: BUILD_CONFIG_RAW secret not set"
            exit 1
          fi
          curl -fsSL -A "Mozilla/5.0" "$RAW_URL" -o build_config.json
          if ! jq empty build_config.json 2>/dev/null; then
            echo "ERROR: Invalid JSON"
            cat build_config.json
            exit 1
          fi
          jq '.' build_config.json

      - name: Analyze configuration
        id: analyze
        run: |
          PROJECT_NAME=$(jq -r '.project_name // "unknown"' build_config.json)
          PROJECT_TYPE=$(jq -r '.type // "unknown"' build_config.json)
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "project_type=$PROJECT_TYPE" >> $GITHUB_OUTPUT
          echo "Project=$PROJECT_NAME | Type=$PROJECT_TYPE"

      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /opt/android-ndk-r26d
          key: android-ndk-r26d-v1

      - name: Download Android NDK r26d
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Android NDK r26d..."
          curl -fSL "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip" -o /tmp/ndk.zip
          echo "Extracting NDK..."
          unzip -q /tmp/ndk.zip -d /opt
          rm /tmp/ndk.zip
          echo "NDK ready"
          ls /opt/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/ | head -10

      - name: Set NDK environment variables
        run: |
          NDK_HOME="/opt/android-ndk-r26d"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TOOLCHAIN/bin/armv7a-linux-androideabi21-clang"
          CXX="$TOOLCHAIN/bin/armv7a-linux-androideabi21-clang++"
          AR="$TOOLCHAIN/bin/llvm-ar"
          RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          STRIP="$TOOLCHAIN/bin/llvm-strip"

          echo "NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "ANDROID_CC=$CC" >> $GITHUB_ENV
          echo "ANDROID_CXX=$CXX" >> $GITHUB_ENV
          echo "ANDROID_AR=$AR" >> $GITHUB_ENV
          echo "ANDROID_RANLIB=$RANLIB" >> $GITHUB_ENV
          echo "ANDROID_STRIP=$STRIP" >> $GITHUB_ENV

          echo "NDK paths set:"
          echo "CC  = $CC"
          echo "AR  = $AR"

      - name: Install Rust + Android ARM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Configure Cargo linker for Android ARM
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << CARGO_EOF
          [target.armv7-linux-androideabi]
          linker = "$ANDROID_CC"
          ar = "$ANDROID_AR"
          CARGO_EOF

          echo "Cargo config:"
          cat .cargo/config.toml

      - name: Cache OpenSSL for Android ARM
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: /tmp/openssl-android-arm
          key: openssl-3.3.2-android-arm21-v1

      - name: Build OpenSSL static for Android ARM
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y make perl

          OPENSSL_VERSION="3.3.2"
          echo "Downloading OpenSSL $OPENSSL_VERSION..."
          curl -fSL "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" | tar xz -C /tmp
          cd /tmp/openssl-${OPENSSL_VERSION}

          export PATH="$TOOLCHAIN/bin:$PATH"
          export ANDROID_NDK_ROOT="$NDK_HOME"
          export CC="$ANDROID_CC"
          export CXX="$ANDROID_CXX"
          export AR="$ANDROID_AR"
          export RANLIB="$ANDROID_RANLIB"

          ./Configure android-arm \
            -D__ANDROID_API__=21 \
            --prefix=/tmp/openssl-android-arm \
            no-shared \
            no-tests \
            no-apps \
            no-engine \
            no-comp

          make -j$(nproc) 2>&1 | tail -5
          make install_sw

          echo "OpenSSL built:"
          ls /tmp/openssl-android-arm/lib/
          ls /tmp/openssl-android-arm/include/openssl/ | head -5

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-registry-android-arm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-android-arm-

      - name: Install system build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc

          jq -r '.steps[] | select(.type == "apt_install") | .packages[]' build_config.json | while read -r pkg; do
            echo "Installing: $pkg"
            sudo apt-get install -y "$pkg" || echo "Skip: $pkg"
          done

      - name: Download sources
        run: |
          mkdir -p /tmp/build-sources

          jq -c '.steps[] | select(.type == "git_clone")' build_config.json | while read -r step; do
            URL=$(echo "$step" | jq -r '.url')
            BRANCH=$(echo "$step" | jq -r '.branch // "main"')
            NAME=$(echo "$step" | jq -r '.name // "repo"')
            echo "Cloning $URL => $NAME (branch: $BRANCH)"
            git clone --depth 1 --branch "$BRANCH" "$URL" "/tmp/build-sources/$NAME"
            echo "Clone OK: $NAME"
          done

          jq -c '.steps[] | select(.type == "download")' build_config.json | while read -r step; do
            URL=$(echo "$step" | jq -r '.url')
            FILENAME=$(echo "$step" | jq -r '.filename // "file"')
            curl -fSL -o "/tmp/build-sources/$FILENAME" "$URL"
          done

          cp build_config.json /tmp/build-sources/

      - name: Build for Android ARM (Termux native)
        id: build
        run: |
          set -e
          PROJECT_NAME="${{ steps.analyze.outputs.project_name }}"

          export OPENSSL_STATIC=1
          export OPENSSL_DIR=/tmp/openssl-android-arm
          export OPENSSL_LIB_DIR=/tmp/openssl-android-arm/lib
          export OPENSSL_INCLUDE_DIR=/tmp/openssl-android-arm/include
          export OPENSSL_NO_VENDOR=0

          export CC="$ANDROID_CC"
          export CXX="$ANDROID_CXX"
          export AR="$ANDROID_AR"
          export RANLIB="$ANDROID_RANLIB"

          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$ANDROID_CC"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_AR="$ANDROID_AR"

          cd /tmp/build-sources

          jq -c '.steps[] | select(.type == "build")' build_config.json | while read -r step; do
            COMMAND=$(echo "$step" | jq -r '.command')
            WORKDIR=$(echo "$step" | jq -r '.workdir // "."')

            MODIFIED=$(echo "$COMMAND" | \
              sed 's/cross build/cargo build/g' | \
              sed 's/cross /cargo /g' | \
              sed 's/--target [^ ]*//g' | \
              sed 's/--release//')

            FINAL_CMD="$MODIFIED --target armv7-linux-androideabi --release"

            echo "=== Build Step ==="
            echo "Dir : $WORKDIR"
            echo "Cmd : $FINAL_CMD"
            echo "=================="

            cd /tmp/build-sources/$WORKDIR
            eval "$FINAL_CMD"
            cd /tmp/build-sources
          done

          echo "=== Searching for binary: $PROJECT_NAME ==="

          BINARY=$(find /tmp/build-sources \
            -path "*/target/armv7-linux-androideabi/release/${PROJECT_NAME}" \
            -type f \
            ! -name '*.d' \
            ! -name '*.rlib' \
            | head -1)

          if [ -z "$BINARY" ]; then
            BINARY=$(find /tmp/build-sources \
              -name "$PROJECT_NAME" \
              -type f \
              -executable \
              ! -path '*/.git/*' \
              | head -1)
          fi

          if [ -z "$BINARY" ]; then
            echo "ERROR: Binary not found"
            find /tmp/build-sources -path '*/target/*' -type f ! -name '*.d' ! -name '*.rlib' | head -20
            exit 1
          fi

          echo "Binary found: $BINARY"

          "$ANDROID_STRIP" "$BINARY" 2>/dev/null && echo "Strip OK" || echo "Strip skipped"

          ABSOLUTE_BINARY_PATH="/tmp/build-sources/${PROJECT_NAME}"
          cp "$BINARY" "$ABSOLUTE_BINARY_PATH"
          chmod +x "$ABSOLUTE_BINARY_PATH"

          echo "=== ELF Verification (must be ARM Android) ==="
          file "$ABSOLUTE_BINARY_PATH"
          readelf -h "$ABSOLUTE_BINARY_PATH" | grep -E "Class|Type|Machine|Flags"
          echo "Dynamic deps (must be minimal for Termux):"
          readelf -d "$ABSOLUTE_BINARY_PATH" | grep NEEDED || echo "No dynamic deps (static)"
          echo "================================================"

          FILE_SIZE=$(stat -c%s "$ABSOLUTE_BINARY_PATH")
          FILE_SIZE_MB=$(echo "scale=2; $FILE_SIZE / 1048576" | bc)
          echo "Size: ${FILE_SIZE_MB} MB"

          echo "BINARY_PATH=$ABSOLUTE_BINARY_PATH" >> $GITHUB_ENV
          echo "BINARY_SIZE=${FILE_SIZE_MB}" >> $GITHUB_ENV

      - name: Install telegram
        run: npm install telegram

      - name: Send to Telegram
        run: |
          node << 'NODE_SCRIPT'
          const { TelegramClient, Api } = require('telegram');
          const { StringSession } = require('telegram/sessions');
          const fs = require('fs');

          const apiId = parseInt(process.env.TELEGRAM_API_ID);
          const apiHash = process.env.TELEGRAM_API_HASH;
          const botToken = process.env.TELEGRAM_BOT_TOKEN;
          const channelId = process.env.TELEGRAM_CHANNEL_ID;
          const binaryPath = process.env.BINARY_PATH;
          const projectName = process.env.PROJECT_NAME;
          const binarySize = process.env.BINARY_SIZE;

          if (!fs.existsSync(binaryPath)) {
            console.error('Binary not found:', binaryPath);
            process.exit(1);
          }

          let uploadDone = false;

          (async () => {
            const client = new TelegramClient(new StringSession(''), apiId, apiHash, {
              connectionRetries: 5
            });

            await client.start({ botAuthToken: botToken });
            console.log('Connected to Telegram');

            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const fileName = `${projectName}_termux_arm32_${timestamp}`;

            const caption = [
              `Build Successful (Termux Native - No proot needed)`,
              `Project: ${projectName}`,
              `Target: armv7-linux-androideabi (Android ARM32)`,
              `Date: ${timestamp}`,
              `Size: ${binarySize} MB`,
              `Built with: Android NDK r26d + Rust stable`,
              ``,
              `Installation in Termux (direct, no proot):`,
              `chmod +x ${fileName}`,
              `mv ${fileName} $PREFIX/bin/${projectName}`,
              `${projectName} --version`
            ].join('\n');

            let entity = null;

            if (channelId.startsWith('@')) {
              entity = channelId;
            } else {
              const cleanId = parseInt(channelId.replace(/^-100/, ''));
              try {
                const result = await client.invoke(
                  new Api.channels.GetChannels({
                    id: [new Api.InputChannel({
                      channelId: BigInt(cleanId),
                      accessHash: BigInt(0)
                    })]
                  })
                );
                if (result.chats && result.chats.length > 0) {
                  entity = result.chats[0];
                  console.log('Channel:', entity.title);
                }
              } catch {
                entity = new Api.InputPeerChannel({
                  channelId: BigInt(cleanId),
                  accessHash: BigInt(0)
                });
              }
            }

            if (!entity) {
              console.error('Could not resolve channel');
              process.exit(1);
            }

            console.log('Uploading:', fileName);

            await client.sendFile(entity, {
              file: binaryPath,
              caption: caption,
              forceDocument: true,
              fileName: fileName,
              workers: 4
            });

            uploadDone = true;
            console.log('Upload complete');

            setTimeout(async () => {
              try { await client.disconnect(); } catch (_) {}
              process.exit(0);
            }, 3000);

          })().catch(err => {
            const msg = err.errorMessage || err.message || String(err);
            if (uploadDone || msg === 'TIMEOUT') {
              console.log('Upload succeeded, ignoring background timeout');
              process.exit(0);
            }
            console.error('Error:', msg);
            process.exit(1);
          });
          NODE_SCRIPT
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BINARY_PATH: ${{ env.BINARY_PATH }}
          PROJECT_NAME: ${{ steps.analyze.outputs.project_name }}
          BINARY_SIZE: ${{ env.BINARY_SIZE }}

      - name: Cleanup
        if: always()
        run: |
          rm -f build_config.json
          rm -rf /tmp/build-sources
          echo "Cleanup complete"
